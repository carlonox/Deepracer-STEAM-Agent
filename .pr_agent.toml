# Config del revisor propio (PR-Agent + OpenRouter). Se lee solo.
# Modelo: barato para triage; si un ID deja de existir, elójanlo del
# dashboard de OpenRouter (tier gratuito, ~1000 req/día sobra a este volumen).

[config]
model = "openrouter/google/gemini-2.0-flash-001"
fallback_models = ["openrouter/meta-llama/llama-3.3-70b-instruct:free"]
response_language = "es"

[pr_reviewer]
# Reglas DEL ROBOT que el revisor genérico no conoce. Todo lo demás
# (estilo general, summaries) lo hace CodeRabbit; este job solo marca
# lo específico del proyecto. No bloquear por gusto: Major solo si toca
# hardware, secretos o gobernanza.
extra_instructions = """Prioriza SIEMPRE estas reglas del repo Deepracer-STEAM-Agent:
1. Canal físico SOLO por backend Node (apps/backend :5002). Marca Major todo
   cambio que mueva el vehículo por SSH, ROS directo o página web del robot.
2. Nada de /api/start, /api/manual_drive ni scripts de manejo como prueba
   automática. Los tests físicos exigen autorización, operador y zona despejada.
3. Cero secretos nuevos (.env, tokens, claves, state.db, certs). Si el diff los
   trae, es bloqueante aunque gitleaks no lo marque.
4. Conventional Commits 1.0.0 en títulos (type(scope): imperativo, ≤72 chars).
5. Docs e índices van en la misma unidad de cambio (código + skills + README).
6. Responde en español, conciso, con archivo:línea."""

[pr_description]
generate_ai_title = false
add_original_user_description = true
publish_description_as_comment = false
