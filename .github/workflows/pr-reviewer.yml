name: pr-reviewer

# Revisor propio (gratuito): PR-Agent open-source + OpenRouter.
# Complementa a CodeRabbit en reglas DEL ROBOT que el genérico no conoce
# (canal backend-only, gates físicos, Conventional Commits del repo).
# Requiere el secreto de repo OPENROUTER_API_KEY en Settings → Secrets
# and variables → Actions (lo pone un mantenedor, nunca en el repo).
# Sin ese secreto el job se omite en silencio.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-reviewer-${{ github.event.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      OPENROUTER.KEY: "${{ secrets.OPENROUTER_API_KEY }}"
    steps:
      - id: check
        name: Verificar secreto (sin exponerlo)
        run: |
          if [ -n "${OPENROUTER_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY ausente: se omite la revision propia."
          fi
        env:
          OPENROUTER_KEY: "${{ secrets.OPENROUTER_API_KEY }}"

      - name: PR-Agent (OpenRouter)
        if: steps.check.outputs.has_key == 'true'
        uses: The-PR-Agent/pr-agent@main
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          OPENROUTER.KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          # Bootstrap: .pr_agent.toml solo se lee desde main (tras el merge).
          # Estas env cubren la primera revisión; el toml manda después.
          config.model: "openrouter/google/gemini-2.0-flash-001"
          config.fallback_models: '["openrouter/meta-llama/llama-3.3-70b-instruct:free"]'
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
