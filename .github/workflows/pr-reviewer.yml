name: pr-reviewer

# Revisor propio (gratuito): PR-Agent open-source + OpenRouter.
# Complementa a CodeRabbit en reglas DEL ROBOT que el genérico no conoce
# (canal backend-only, gates físicos, Conventional Commits del repo).
# Requiere el secreto de repo OPENROUTER_API_KEY en Settings → Secrets
# and variables → Actions (lo pone un mantenedor, nunca en el repo).
# Sin ese secreto el job se omite en silencio.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-reviewer-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # Tope duro: si el stack de IA se cuelga, el job muere en 8 min en vez de
    # quedarse "in_progress" indefinidamente (visto en PR #23).
    timeout-minutes: 8
    permissions:
      pull-requests: write
      contents: read
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      OPENROUTER.KEY: "${{ secrets.OPENROUTER_API_KEY }}"
    steps:
      - id: check
        name: Verificar secreto (sin exponerlo)
        run: |
          if [ -n "${OPENROUTER_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY ausente: se omite la revision propia."
          fi
        env:
          OPENROUTER_KEY: "${{ secrets.OPENROUTER_API_KEY }}"

      - name: PR-Agent (OpenRouter)
        if: steps.check.outputs.has_key == 'true'
        # Pinneado a SHA (2026-09-08) anti supply-chain; subir con digest tras verificar.
        uses: The-PR-Agent/pr-agent@29709d42e805fceab0a74580a191499b2d3c725a
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          OPENROUTER.KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          # Bootstrap: .pr_agent.toml solo se lee desde main (tras el merge).
          # Estas env cubren la primera revisión; el toml manda después.
          # Stack pinnado por benchmark offline (2026-09-10). Espejo del toml.
          config.model: "openrouter/nex-agi/nex-n2.5-pro:free"
          config.fallback_models: '["openrouter/nvidia/nemotron-3-super-120b-a12b:free", "openrouter/cohere/north-mini-code:free", "openrouter/openrouter/free"]'
          config.response_language: "es"
          pr_reviewer.extra_instructions: |
            Prioriza SIEMPRE estas reglas del repo Deepracer-STEAM-Agent:
            1. Canal físico SOLO por backend Node (apps/backend :5002). Marca Major todo
               cambio que mueva el vehículo por SSH, ROS directo o página web del robot.
            2. Nada de /api/start, /api/manual_drive ni scripts de manejo como prueba
               automática. Los tests físicos exigen autorización, operador y zona despejada.
            3. Cero secretos nuevos (.env, tokens, claves, state.db, certs). Si el diff los
               trae, es bloqueante aunque gitleaks no lo marque.
            4. Conventional Commits 1.0.0 en títulos (type(scope): imperativo, ≤72 chars).
            5. Docs e índices van en la misma unidad de cambio (código + skills + README).
            6. Responde en español, conciso, con archivo:línea.
            7. En XR inmersiva los gatillos son buttons[0]/[1] (inputSource.gamepad); el
               mapeo STANDARD 6=LT/7=RT solo vale FUERA de XR (navigator.getGamepads).
               No marques el fallback como bug por esa diferencia.
            8. Veredicto primero (Major/Minor/No issue) con archivo:línea y cita del diff.
               Prohibidos los sermones genéricos de seguridad sin evidencia en el cambio.
          # Sin esto PR-Agent rechaza IDs que no trae en su tabla MAX_TOKENS.
          config.custom_model_max_tokens: "200000"
          config.max_model_tokens: "200000"
          # Corte por llamada: un free colgado no debe pasar de 90s.
          config.ai_timeout: "90"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
